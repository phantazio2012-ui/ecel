name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm install

      - name: Créer le projet Android
        run: npx cap add android

      - name: Configuration Firebase Android (google-services.json)

        run: |
          if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; echo "google-services.json ajouté"; else echo "google-services.json absent (facultatif)"; fi

      - name: Icônes et écran de démarrage
        run: npx capacitor-assets generate --android

      - name: Autorisations (notifications et alarmes)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <application#' "$M"

      - name: Numéro de version (détection des mises à jour)
        run: sed -i "s/const APP_BUILD=0;/const APP_BUILD=${{ github.run_number }};/" www/index.html

      - name: Clé de signature (secret GitHub)
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "Secret KEYSTORE_B64 manquant (voir LISEZ-MOI)"; exit 1; fi
          echo "$KS" | base64 -d > "$GITHUB_WORKSPACE/ecel.keystore"

      - name: Signature de l'application
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  ecel {
                      storeFile file(System.getenv('KS_FILE'))
                      storePassword System.getenv('KS_PASS')
                      keyAlias 'ecel'
                      keyPassword System.getenv('KS_PASS')

                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.ecel
                      minifyEnabled false
                  }
                  debug {
                      signingConfig signingConfigs.ecel
                  }
              }
          }
          GRADLE

      - name: Synchroniser et compiler
        env:
          KS_FILE: ${{ github.workspace }}/ecel.keystore
          KSP: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          export KS_PASS="$(printf '%s' "$KSP" | tr -d '[:space:]')"
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Ministere-ECEL.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ministere-ECEL-apk
          path: Ministere-ECEL.apk


      - name: Publier une version téléchargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Ministère ECEL ${{ github.run_number }}
          files: Ministere-ECEL.apk
