name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm install

      - name: Créer le projet Android
        run: npx cap add android

      - name: Configuration Firebase Android (google-services.json)
        run: |
          if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; echo "google-services.json ajouté"; else echo "google-services.json absent (facultatif)"; fi

      - name: Icônes et écran de démarrage
        run: npx capacitor-assets generate --android

      - name: Autorisations (notifications et alarmes)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>\n    <application#' "$M"

      - name: Sonnerie d'alarme de prière
        run: |
          mkdir -p android/app/src/main/res/raw
          python3 - <<'PY'
          import wave,struct,math
          sr=22050;fr=[]
          def tone(f,d,v=0.6):
              n=int(sr*d)
              for i in range(n):
                  e=min(1,i/400)*math.exp(-3.2*i/n)
                  fr.append(int(32000*v*e*(math.sin(2*math.pi*f*i/sr)+0.4*math.sin(4*math.pi*f*i/sr))/1.4))
          def gap(d): fr.extend([0]*int(sr*d))
          for _ in range(4):
              for f in (659,784,988,1319): tone(f,0.45)
              gap(0.6)
          w=wave.open('android/app/src/main/res/raw/alarm_ecel.wav','wb');w.setnchannels(1);w.setsampwidth(2);w.setframerate(sr)
          w.writeframes(b''.join(struct.pack('<h',x) for x in fr));w.close()
          PY

      - name: Installation automatique des mises à jour (module natif)
        run: |
          D=android/app/src/main/java/ci/ecel/ministere
          mkdir -p "$D" android/app/src/main/res/xml
          cat > "$D/ApkInstaller.java" <<'JAVA_EOF'
          package ci.ecel.ministere;

          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          @CapacitorPlugin(name = "ApkInstaller")
          public class ApkInstaller extends Plugin {

              private boolean allowed() {
                  Context c = getContext();
                  return Build.VERSION.SDK_INT < 26 || c.getPackageManager().canRequestPackageInstalls();
              }

              @PluginMethod
              public void install(final PluginCall call) {
                  final String link = call.getString("url");
                  if (link == null) { call.reject("url manquante"); return; }
                  if (!allowed()) {
                      try {
                          Intent i = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + getContext().getPackageName()));
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          getContext().startActivity(i);
                      } catch (Exception e) { }
                      call.reject("perm", "perm");
                      return;
                  }
                  new Thread(new Runnable() {
                      public void run() {
                          try {
                              File f = new File(getContext().getCacheDir(), "update.apk");
                              HttpURLConnection h = (HttpURLConnection) new URL(link).openConnection();
                              h.setInstanceFollowRedirects(true);
                              h.setConnectTimeout(20000);
                              h.setReadTimeout(30000);
                              int code = h.getResponseCode();
                              if (code != 200) throw new Exception("HTTP " + code);
                              long total = h.getContentLengthLong();
                              InputStream in = h.getInputStream();
                              FileOutputStream out = new FileOutputStream(f);
                              byte[] buf = new byte[32768];
                              long done = 0;
                              int last = -1, n;
                              while ((n = in.read(buf)) > 0) {
                                  out.write(buf, 0, n);
                                  done += n;
                                  int pct = total > 0 ? (int) (done * 100 / total) : 0;
                                  if (pct != last) {
                                      last = pct;
                                      JSObject o = new JSObject();
                                      o.put("pct", pct);
                                      notifyListeners("progress", o);
                                  }
                              }
                              out.close();
                              in.close();
                              Uri uri = FileProvider.getUriForFile(getContext(), getContext().getPackageName() + ".fileprovider", f);
                              Intent i = new Intent(Intent.ACTION_VIEW);
                              i.setDataAndType(uri, "application/vnd.android.package-archive");
                              i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                              getContext().startActivity(i);
                              call.resolve();
                          } catch (Exception e) {
                              call.reject(String.valueOf(e.getMessage()));
                          }
                      }
                  }).start();
              }
          }
          JAVA_EOF
          cat > "$D/MainActivity.java" <<'JAVA_EOF'
          package ci.ecel.ministere;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(ApkInstaller.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA_EOF
          cat > android/app/src/main/res/xml/file_paths.xml <<'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="cache" path="." />
              <files-path name="files" path="." />
              <external-path name="ext" path="." />
          </paths>
          XML_EOF
          ls -R "$D"

      - name: Numéro de version Android (mise à jour sans désinstaller)
        run: |
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" "$G"
          grep -n "versionCode\|versionName" "$G"

      - name: Numéro de version (détection des mises à jour)
        run: sed -i "s/const APP_BUILD=0;/const APP_BUILD=${{ github.run_number }};/" www/index.html

      - name: Signature de l'application
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  ecel {
                      storeFile file(System.getenv('KS_FILE'))
                      storePassword System.getenv('KS_PASS')
                      keyAlias 'ecel'
                      keyPassword System.getenv('KS_PASS')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.ecel
                      minifyEnabled false
                  }
                  debug {
                      signingConfig signingConfigs.ecel
                  }
              }
          }
          GRADLE

      - name: Synchroniser et compiler
        env:
          KS_FILE: ${{ github.workspace }}/ecel-prod.keystore
          KS_PASS: YcZ66rzAb46ScSr2Gq4E
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Ministere-ECEL.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ministere-ECEL-apk
          path: Ministere-ECEL.apk

      - name: Publier une version téléchargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Ministère ECEL ${{ github.run_number }}
          files: Ministere-ECEL.apk
