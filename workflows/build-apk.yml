          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" "$G"
          grep -n "versionCode\|versionName" "$G"

      - name: Numéro de version (détection des mises à jour)
